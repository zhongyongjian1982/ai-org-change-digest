name: daily-digest

on:
  schedule:
    # 20:37 UTC = 04:37 Beijing. Odd minute avoids GitHub's on-the-hour
    # throttling (prior "0 1 * * *" was consistently delayed 3-4 hours).
    - cron: "37 20 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/daily.yml

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build.py
      - name: Back up generated digest
        uses: actions/upload-artifact@v4
        with:
          name: generated-digest-${{ github.run_id }}
          path: |
            data/
            docs/
          retention-days: 7
      - name: Commit updates
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "digest: $(date -u +%Y-%m-%d)"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 10
              git fetch origin main
              git rebase origin/main
            done
            exit 1
          fi
      - name: Sync to Tencent COS
        timeout-minutes: 11
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          pip install coscmd
          coscmd config -a "$TENCENT_SECRET_ID" -s "$TENCENT_SECRET_KEY" -b ted-pages-1409060250 -r ap-guangzhou
          for attempt in 1 2 3; do
            if timeout --kill-after=10s 180s coscmd upload -r -f docs/ aitransformation/; then
              exit 0
            fi
            echo "COS upload attempt ${attempt} failed; retrying in 15 seconds."
            sleep 15
          done
          echo "COS upload failed after 3 bounded attempts. Generated content is saved in GitHub."
          exit 1
      - name: Purge EdgeOne CDN cache
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          pip install tccli
          tccli teo CreatePurgeTask \
            --secretId "$TENCENT_SECRET_ID" \
            --secretKey "$TENCENT_SECRET_KEY" \
            --region ap-guangzhou \
            --ZoneId zone-3ourx6uea6bu \
            --Type purge_prefix \
            --Method invalidate \
            --Targets '["https://www.tedzhong.com/aitransformation/"]'
